name: bench

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'sources/**'
      - 'results/**'
      - 'paper.tex'
      - '*.md'
      - 'LICENSE'
      - 'CITATION.cff'
      - '.opencode/**'
      - 'AGENTS.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'sources/**'
      - 'results/**'
      - 'paper.tex'
      - '*.md'
      - 'LICENSE'
      - 'CITATION.cff'
      - '.opencode/**'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bun-matrix:
    name: bun ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      - run: bun run bench-ci
      - name: Write job summary
        if: always()
        run: bun run src/scripts/ci-summary.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-bun-${{ matrix.os }}
          path: |
            dist/bench-ci-results.json
            dist/ci-summary.md

  node-matrix:
    name: node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["22"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: bun install
      - run: bun run build
      - run: bun x tsx src/scripts/bench-ci.ts
      - name: Write job summary
        if: always()
        run: bun x tsx src/scripts/ci-summary.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-node-${{ matrix.node-version }}-${{ matrix.os }}
          path: |
            dist/bench-ci-results.json
            dist/ci-summary.md

  deno-matrix:
    name: deno ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.3"
      - name: Type-check Deno benchmark ports
        run: deno check src/scripts/deno/bench-ci.ts src/scripts/deno/bench-structured.ts src/scripts/deno/bench.ts src/scripts/deno/collision-100m.ts src/scripts/deno/collision-100m-worker.ts src/scripts/deno/deno-io.ts src/scripts/deno/export-ablation.ts src/scripts/deno/export-baselines.ts src/scripts/deno/export-bits.ts src/scripts/deno/export-degraded.ts src/scripts/deno/export-samples.ts src/scripts/deno/export-structured.ts src/scripts/deno/export-weak-entropy.ts src/scripts/deno/pool.ts src/scripts/deno/stats-core.ts src/scripts/deno/stats-worker.ts src/scripts/deno/stats.ts
      - name: CI benchmark (Deno)
        run: deno run --allow-read --allow-write --allow-env --allow-sys src/scripts/deno/bench-ci.ts
      - name: 100M collision test (Deno, ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: deno run --allow-read --allow-env --allow-sys src/scripts/deno/collision-100m.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-deno-${{ matrix.os }}
          path: |
            dist/bench-ci-results.json

  docs-links:
    name: docs code-reference check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun run src/scripts/verify-doc-paths.ts

  golden-check:
    name: golden-vector check (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install
      - run: bun run build
      # The Rust check compares against the COMMITTED vectors, before anything
      # regenerates them. Regenerating first would make the comparison
      # vacuous: a change to the TypeScript implementation would be written
      # into the file, and Rust would then agree with the new file. The hash
      # check makes the input immutable; the export afterwards proves the
      # committed vectors are still reproducible.
      - run: bun run src/scripts/verify-golden-hashes.ts
      - run: cargo run --manifest-path src/golden-check/Cargo.toml --release
      - name: Export golden vectors (reproducibility check)
        run: bun run src/scripts/export-golden.ts
      - name: Verify the export reproduces the committed vectors
        run: bun run src/scripts/verify-golden-hashes.ts
      - name: Upload golden vectors
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-vectors
          path: golden/

  native-db:
    name: native PostgreSQL + MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: genoid
          POSTGRES_PASSWORD: password
          POSTGRES_DB: genoid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genoid -d genoid"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: genoid
          MYSQL_USER: genoid
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      - name: Run native-DB benchmark (PostgreSQL + MySQL service containers)
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: genoid
          PG_PASSWORD: password
          PG_DB: genoid
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          MYSQL_USER: genoid
          MYSQL_PASSWORD: password
          MYSQL_DB: genoid
          GENOID_COMMIT: ${{ github.sha }}
        run: bun run src/scripts/bench-db-native.ts --rows=100000 --reps=5 --probes=100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db-native
          path: results/db-native.json
      - name: Commit native-DB artifact
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@noreply.github.com"
          git add results/db-native.json
          git diff --cached --quiet && echo "no changes to commit" && exit 0
          git commit -m "ci(evidence): refresh native PostgreSQL/MySQL benchmark artifact"
          # Another auto-commit job may land first; rebase and retry.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1

  consolidate:
    name: consolidate CI results
    runs-on: ubuntu-latest
    needs: [bun-matrix, node-matrix, deno-matrix]
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          path: combined
      - run: bun x tsx src/scripts/ci-consolidate.ts combined
      - name: Write job summary
        if: always()
        run: cat dist/all-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-consolidated
          path: |
            dist/all-results.json
            dist/all-summary.md
      - name: Commit consolidated artifact
        if: github.ref == 'refs/heads/main'
        run: |
          cp dist/all-results.json results/all-results.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/all-results.json
          git diff --cached --quiet && echo "no changes to commit" && exit 0
          git commit -m "ci(evidence): refresh consolidated nine-environment benchmark artifact"
          # Another auto-commit job (e.g. native-db) may land first; rebase and retry.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1

